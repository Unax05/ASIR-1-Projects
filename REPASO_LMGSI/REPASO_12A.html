	<head>
		<title> </title>
		<meta http-equiv="Content-Type" content="text/html;charset=utf-8"  />

	<body>
		<h2>Ejemplo de listas de sleccion y botones</h2>
			<p>Seleccionar un elemento de busqueda:<br/>
			<form method="get" action="https://www.google.com/search"> <!-- method get obligatorio para busquedas en google y adjuntar el action con el searc de google-->
				<select name="q"><!-- name=q, si no, no funcionará la busqueda-->
					<option>XHTML</option>
					<option>XML</option>
					<option>HTML</option>
					<option>CSS</option>
				</select> 
			</form>
			</p>
			<p>
				<input type="submit" value="Buscar en Google" /> <!-- value=Lo que sale en el boto, submit es para enviar -->
				<input type="reset" value="Limpiar Busqueda" /><!-- reset para enviar el contenido -->
			</p> <!-- Los botones son etiquetas línea, no de bloque, necesitaran estar dentro de un parrafo, al igual que los formularios-->
	




	</body>
</html>
