<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="es">
	<head>
		<title> </title>
		<meta http-equiv="Content-Type" content="text/html;charset=utf-8"  />
	</head>
	
	<body>
		<h3>Ejemplo de uso de atribuitos <i>accesskey</i> y <i>tabindex</i> y del boton de transferencia de archivos</h3>
		<form>
			<p>
				Nombre <i>(Alt + shift + n)</i>:<br />
				<input type="text" name="nombre" id="nom" accesskey="n" tabindex="1" maxlength="25" />
			</p>
			<p>
				Apellidos <i>(Alt + shift + a)</i>:<br />
				<input type="text" name="apellidos" id="ape" accesskey="a" tabindex="2" maxlength="25" />
			</p>
			<p>
				Direccion <i>(Alt + shift + i)</i>:<br />
				<input type="text" name="direccion" id="dir" accesskey="i" tabindex="3" maxlength="25" />
			</p>
			<p>
				Codigo Postal <i>(Alt + shift + c)</i>:<br />
				<input type="text" name="codigopostal" id="CP" accesskey="c" tabindex="4"maxlength="5" />
			</p>
			<p>
				Ciudad <i>(Alt + shift + u)</i>:<br />
				<input type="text" name="ciudad" id="ciu" accesskey="u" tabindex="5" maxlength="25" />
			</p>
			<p>
				Comentarios <i>(Alt + shift + o)</i>:<br />
				<textarea rows="8" cols="25" tabindex="6" accesskey="o"></textarea>
			</p>
			<p>
				Archivo <i>(Alt + shift + v)</i>:<br />
				<input type="file" name="archivo" accesskey="v" tabindex="7" />
			</p>
		</form>
			
				

	




	</body>
</html>
