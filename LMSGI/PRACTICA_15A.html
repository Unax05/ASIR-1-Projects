	<body>
	<h1>Ejemplo &lt;fieldset&gt; y &lt;label&gt;</h1>
	<form method="post" action="mailto:argeme.vila@zabalburu.org" enctype="text/plain">
		<fieldset>
			<legend>Información Personal</legend>
			<label for="nombre">Nombre:</label>
			<input type="text" id="nombre" name="nmbr" />
			
			<label for="apellido">Apellido:</label>
			<input type="text" id="apellido" name="ape1" />
			
			<input type="checkbox" id="mayor de edad" name="Mayor de edad" value="si" />
			<label for="mayor de edad">Mayor de edad::</label>
		</fieldset>
		<fieldset>
			<legend>Información academica</legend>
			<label for="Universidad">Universidad:</label>
			<input type="Text" id="Universidad" name="Universidad" />
			
			<input type="checkbox" id="Titulo" name="Titulo obtenido" value="si" />
			<label for="Titulo">Titulo obtenido:</label>
			<p>Idiomas:</p>
				<input type="checkbox" id="Euskera" name="Euskera" value="si" />Euskera<br />
				<input type="checkbox" id="Inglés" name="Inglés" value="si" />Ingles<br />
				<input type="checkbox" id="Otros" name="Otros" value="si" />Otros
		</fieldset>	
		<fieldset>	
			<input type="submit" value="Enviar correo" />
			<input type="reset" value="Nuevo registro" />
		</fieldset>
	</form>

	




	</body>
</html>
