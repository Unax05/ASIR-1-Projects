	<body>
	<h2>Ejemplo de uso de atributos <i>accesskey</i> y <i>tabindex</i> y del botón de tranferencia de archivos</h2>
		<p>Nombre <i>(Alt + Shift + n)</i>:
		<input type="text" name="nombre" id="nombre" maxlength="25" />
		</p>
		<p>Apellidos <i>(Alt + Shift + a)</i>:
		<input type="text" name="apellido_1" id="ape1" maxlength="25" />
		</p>
		<p>Dirección <i>(Alt + Shift + i)</i>:
		<input type="text" name="apellido_2" id="ape2" maxlength="25" />
		</p>
		<p>Código postal <i>(Alt + Shift + c)</i>:
		<input type="text" name="dirección" id="dir" maxlength="25" />
		</p>
		<p>Ciudad<i>(Alt + Shift + u)</i>:
		<input type="text" name="CP" id="CP" size="3" maxlength="5" />
		</p>
		 <p>Estudios:<i>(Alt + Shift + o)</i>
		 <textarea name="comentario" id="comentario" rows="10" cols="40"></textarea>
		 <p>Archivo<i>(Alt + Shift + v)</i>:
		<input type="text" name="CP" id="CP" size="3" maxlength="5" />
		
		<input type="text" name="Examinar" id="Ex_arch" />

	




	</body>
</html>
